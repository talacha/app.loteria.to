<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>¡Lotería!</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FFC233}a:hover{color:#FFE08A}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #E5177E; color: #16182F; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px 20px 24px; gap: 18px; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; height: 64px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr))">
    <span style="background: #FFC233; clip-path: polygon(0 0, 100% 0, 100% 70%, 50% 100%, 0 70%)"></span>
    <span style="background: #0E9F7E; clip-path: polygon(0 0, 100% 0, 100% 70%, 50% 100%, 0 70%)"></span>
    <span style="background: #2F6FE4; clip-path: polygon(0 0, 100% 0, 100% 70%, 50% 100%, 0 70%)"></span>
    <span style="background: #FFF6E5; clip-path: polygon(0 0, 100% 0, 100% 70%, 50% 100%, 0 70%)"></span>
    <span style="background: #FFC233; clip-path: polygon(0 0, 100% 0, 100% 70%, 50% 100%, 0 70%)"></span>
    <span style="background: #0E9F7E; clip-path: polygon(0 0, 100% 0, 100% 70%, 50% 100%, 0 70%)"></span>
  </div>

  <h1 style="margin: 56px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 64px; line-height: 0.95; letter-spacing: -0.03em; text-align: center; color: #FFF6E5; text-shadow: 0 5px 0 #16182F">¡Lotería!</h1>
  <p style="margin: 0; font-size: 18px; text-align: center; color: #FFF6E5">Itzel completó la diagonal</p>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; width: 280px; padding: 8px; border-radius: 20px; background: #FFF6E5; border: 3px solid #16182F; box-shadow: 0 6px 0 #16182F; transform: rotate(-3deg)">
    <sc-for list="{{board}}" as="b" hint-placeholder-count="16">
      <div style="{{b.style}}">
        <img src="{{b.src}}" alt="" style="width: 42px; height: 42px">
        <sc-if value="{{b.marked}}" hint-placeholder-val="{{ false }}">
          <span aria-hidden="true" style="position: absolute; left: 50%; top: 50%; width: 26px; height: 18px; margin: -9px 0 0 -13px; border-radius: 50%; background: #6B2F23; border: 2px solid #16182F"></span>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <section aria-labelledby="learned" style="width: 100%; box-sizing: border-box; background: #FFF6E5; border: 3px solid #16182F; border-radius: 22px; box-shadow: 0 5px 0 #16182F; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
    <h2 id="learned" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 18px">Palabras de tu línea</h2>
    <ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px; font-size: 15px">
      <li><strong>tonatiuh</strong> · el sol</li>
      <li><strong>huitzitzilin</strong> · el colibrí</li>
      <li><strong>La Tortuga</strong> · sin palabra aún</li>
      <li><strong>La Estrella</strong> · sin palabra aún</li>
    </ul>
    <span style="align-self: flex-start; font-size: 12px; font-weight: 700; background: #FFE08A; border: 2px solid #16182F; border-radius: 999px; padding: 2px 10px">palabras en revisión por hablantes</span>
  </section>

  <div style="margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: 10px">
    <a href="Play.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 58px; border-radius: 18px; background: #FFC233; color: #16182F; border: 3px solid #16182F; box-shadow: 0 5px 0 #16182F; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; text-decoration: none">Otra ronda</a>
    <a href="Lobby.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; color: #FFF6E5; font-size: 16px; font-weight: 700">Volver a la sala</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const A = ['68822fdae8f9f5cf3b61b04605307e3d', '863e7768b2a8aea9df5ceb83eaa75061', 'dbc658a00d19e785d94af6f5f8452518', 'de2dcdc3fa592ecd50949f52641974af', '8d3d0f44bf46c1fbac2ba6a6326b8a03', '20eb01890006bcef796790c1d86a2892', 'e733d64945c1d95dfffdcc9d2e1f7166', 'b7ae0c98e9b60e420a87b581057e38ee', 'b0f4cb5cb0f804544cc1dc879e23517a', 'f02561cbdcd7350ee380067ed6a39aa2', '4ee3fee82e57dc2d92a8f482f1713c54', 'a2977d7ccb0cfe084c6de87ef1ee549a', 'b7bebb33a4221d9f2106481b8d9dac9f', 'fbe8cd5fa66c6bd93d6e2ec6a457dc2c', '0fb3b29bc9bce3e894d39bc1fcf335e3', 'b1ebad513b43539b526f2e92198fc720'];
    const line = [0, 5, 10, 15];
    const extra = [1, 6];
    const board = A.map((id, i) => ({
      src: '/_blob/' + id,
      marked: line.includes(i) || extra.includes(i),
      style: 'position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:10px;border:2px solid #16182F;' + (line.includes(i) ? 'background:#FFC233;' : 'background:#FFFFFF;')
    }));
    return { board };
  }
}
</script>
</body>
</html>
