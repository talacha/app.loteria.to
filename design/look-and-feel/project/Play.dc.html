<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>El cantor canta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FFC233}a:hover{color:#FFE08A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1E2142; color: #FFF6E5; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column; padding: 18px 16px 16px; gap: 12px; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; min-height: 36px">
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 0.08em">K7MPQ</span>
    <span style="font-size: 14px; color: #C9C3E6">Carta 12 de 54</span>
    <span style="font-size: 13px; font-weight: 700; color: #FFF6E5; background: {{langColor}}; border: 2px solid #16182F; border-radius: 999px; padding: 4px 12px">{{langName}}</span>
  </div>

  <section aria-label="Carta cantada" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 22px; background: #2A2E58; border: 3px solid #16182F; box-shadow: 0 5px 0 #0C0D1E">
    <button type="button" aria-label="Repetir la carta" style="display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; flex-shrink: 0; border-radius: 999px; background: #FFC233; border: 3px solid #16182F; cursor: pointer; box-shadow: 0 0 0 6px rgba(255,194,51,0.22), 0 0 0 14px rgba(255,194,51,0.10)">
      <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#16182F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="#16182F"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
    </button>
    <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1">
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #C9C3E6">El cantor canta</span>
      <sc-if value="{{showWord}}" hint-placeholder-val="{{ true }}">
        <span aria-live="polite" style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 38px; line-height: 1; letter-spacing: -0.02em; color: #FFF6E5">{{word}}</span>
      </sc-if>
      <sc-if value="{{escucha}}" hint-placeholder-val="{{ false }}">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 1; color: #FFF6E5">Escucha…</span>
      </sc-if>
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px">
        <sc-if value="{{draft}}" hint-placeholder-val="{{ true }}">
          <span style="font-size: 11px; font-weight: 700; color: #16182F; background: #FFE08A; border: 2px solid #16182F; border-radius: 999px; padding: 1px 8px">palabra en revisión</span>
        </sc-if>
        <span style="flex: 1; height: 6px; border-radius: 999px; background: #45497F; overflow: hidden"><span style="display: block; width: 62%; height: 100%; background: #FFC233"></span></span>
      </div>
    </div>
  </section>

  <section aria-labelledby="q" style="display: flex; flex-direction: column; gap: 8px">
    <h2 id="q" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px">¿Cuál es?</h2>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{choices}}" as="c" hint-placeholder-count="3">
        <button type="button" aria-label="{{c.label}}" onClick="{{c.pick}}" disabled="{{c.disabled}}" style="{{c.style}}">
          <img src="{{c.src}}" alt="" style="width: 70px; height: 70px">
          <sc-if value="{{c.isRight}}" hint-placeholder-val="{{ false }}">
            <span style="position: absolute; top: -10px; right: -10px; display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 999px; background: #0E9F7E; border: 3px solid #16182F">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFF6E5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            </span>
          </sc-if>
        </button>
      </sc-for>
    </div>
  </section>

  <div role="status" style="{{feedbackStyle}}">
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 18px">{{feedbackTitle}}</span>
    <span style="font-size: 14px; line-height: 1.3">{{feedbackText}}</span>
  </div>

  <section aria-label="Tu tabla" style="display: flex; flex-direction: column; gap: 8px; margin-top: auto">
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 8px; border-radius: 20px; background: #FFF6E5; border: 3px solid #16182F; box-shadow: 0 5px 0 #0C0D1E">
      <sc-for list="{{board}}" as="b" hint-placeholder-count="16">
        <div style="{{b.style}}">
          <img src="{{b.src}}" alt="{{b.label}}" style="width: 56px; height: 56px">
          <span style="font-size: 10px; font-weight: 700; color: #16182F; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%">{{b.label}}</span>
          <sc-if value="{{b.marked}}" hint-placeholder-val="{{ false }}">
            <span aria-hidden="true" style="position: absolute; left: 50%; top: 44%; width: 34px; height: 24px; margin: -12px 0 0 -17px; border-radius: 50%; background: #6B2F23; border: 2px solid #16182F; box-shadow: inset -4px -3px 0 #4A1F16, inset 4px 3px 0 #8A4A3A"></span>
          </sc-if>
        </div>
      </sc-for>
    </div>
    <sc-if value="{{won}}" hint-placeholder-val="{{ false }}">
      <a href="Win.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 18px; background: #E5177E; color: #FFF6E5; border: 3px solid #16182F; box-shadow: 0 5px 0 #0C0D1E; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; text-decoration: none">¡Lotería!</a>
    </sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["nah","es","en"],"default":"nah"},"escucha":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { result: null, wrong: [] }; }
  renderVals() {
    const lang = this.props.lang ?? 'nah';
    const escucha = this.props.escucha ?? false;
    const A = {
      sol: '/_blob/68822fdae8f9f5cf3b61b04605307e3d', luna: '/_blob/0fb3b29bc9bce3e894d39bc1fcf335e3', estrella: '/_blob/b1ebad513b43539b526f2e92198fc720',
      maiz: '/_blob/863e7768b2a8aea9df5ceb83eaa75061', rana: '/_blob/dbc658a00d19e785d94af6f5f8452518', nube: '/_blob/de2dcdc3fa592ecd50949f52641974af',
      jaguar: '/_blob/8d3d0f44bf46c1fbac2ba6a6326b8a03', colibri: '/_blob/20eb01890006bcef796790c1d86a2892', chile: '/_blob/e733d64945c1d95dfffdcc9d2e1f7166',
      mariposa: '/_blob/b7ae0c98e9b60e420a87b581057e38ee', nopal: '/_blob/b0f4cb5cb0f804544cc1dc879e23517a', frijol: '/_blob/f02561cbdcd7350ee380067ed6a39aa2',
      tortuga: '/_blob/4ee3fee82e57dc2d92a8f482f1713c54', montana: '/_blob/a2977d7ccb0cfe084c6de87ef1ee549a', aguacate: '/_blob/b7bebb33a4221d9f2106481b8d9dac9f',
      tomate: '/_blob/fbe8cd5fa66c6bd93d6e2ec6a457dc2c'
    };
    const N = {
      es: { sol: 'El Sol', luna: 'La Luna', estrella: 'La Estrella', maiz: 'El Maíz', rana: 'La Rana', nube: 'La Nube', jaguar: 'El Jaguar', colibri: 'El Colibrí', chile: 'El Chile', mariposa: 'La Mariposa', nopal: 'El Nopal', frijol: 'El Frijol', tortuga: 'La Tortuga', montana: 'La Montaña', aguacate: 'El Aguacate', tomate: 'El Tomate' },
      en: { sol: 'The Sun', luna: 'The Moon', estrella: 'The Star', maiz: 'The Maize', rana: 'The Frog', nube: 'The Cloud', jaguar: 'The Jaguar', colibri: 'The Hummingbird', chile: 'The Chili', mariposa: 'The Butterfly', nopal: 'The Nopal', frijol: 'The Bean', tortuga: 'The Turtle', montana: 'The Mountain', aguacate: 'The Avocado', tomate: 'The Tomato' },
      nah: { sol: 'tonatiuh', luna: 'metztli', maiz: 'centli', jaguar: 'ocelotl', colibri: 'huitzitzilin', chile: 'chilli', nopal: 'nopalli', frijol: 'etl', montana: 'tepetl', aguacate: 'ahuacatl', tomate: 'tomatl' }
    };
    const LANG = { nah: { name: 'Náhuatl', color: '#0E9F7E' }, es: { name: 'Español', color: '#E5177E' }, en: { name: 'English', color: '#2F6FE4' } };
    const label = (id) => (lang === 'nah' ? (N.nah[id] || N.es[id]) : N[lang][id]);
    const answer = 'sol';
    const ok = this.state.result === 'ok';
    const tile = 'position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:1;min-height:96px;border-radius:20px;border:3px solid #16182F;cursor:pointer;font:inherit;';
    const choices = ['luna', 'sol', 'estrella'].map((id) => {
      const wrong = this.state.wrong.includes(id);
      const right = ok && id === answer;
      return {
        id, src: A[id], label: N.es[id], isRight: right,
        disabled: ok || wrong,
        pick: () => (id === answer ? this.setState({ result: 'ok' }) : this.setState({ result: 'casi', wrong: [...this.state.wrong, id] })),
        style: tile + (right ? 'background:#C9F2E4;box-shadow:0 0 0 4px #0E9F7E,0 5px 0 #0C0D1E;' : wrong ? 'background:#3A3E6A;opacity:0.45;box-shadow:none;transform:translateY(3px);' : 'background:#FFF6E5;box-shadow:0 5px 0 #0C0D1E;')
      };
    });
    const ids = ['sol', 'maiz', 'rana', 'nube', 'jaguar', 'colibri', 'chile', 'mariposa', 'nopal', 'frijol', 'tortuga', 'montana', 'aguacate', 'tomate', 'luna', 'estrella'];
    const pre = ['colibri', 'tortuga', 'estrella', 'maiz', 'chile'];
    const line = [0, 5, 10, 15];
    const board = ids.map((id, i) => {
      const marked = pre.includes(id) || (ok && id === answer);
      const glow = ok && line.includes(i);
      return {
        src: A[id], label: label(id), marked,
        style: 'position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;aspect-ratio:1;border-radius:12px;padding:4px;box-sizing:border-box;border:2px solid #16182F;' + (glow ? 'background:#FFC233;' : 'background:#FFFFFF;')
      };
    });
    const fb = {
      null: { t: 'Toca la carta que escuchaste', x: 'Si está en tu tabla, le ponemos un frijolito.', s: 'background:#2A2E58;color:#E6E1FF;border:2px dashed #6E6AA6;' },
      ok: { t: '¡Eso! ' + label(answer) + ' · ' + N.es[answer], x: 'Frijolito puesto. ¡Completaste la diagonal!', s: 'background:#0E9F7E;color:#FFF6E5;border:3px solid #16182F;' },
      casi: { t: '¡Casi!', x: 'Escúchala otra vez y elige de nuevo. Sin prisa.', s: 'background:#FFC233;color:#16182F;border:3px solid #16182F;' }
    }[String(this.state.result)];
    return {
      word: label(answer), showWord: !escucha, escucha, draft: lang === 'nah',
      langName: LANG[lang].name, langColor: LANG[lang].color,
      choices, board, won: ok,
      feedbackTitle: fb.t, feedbackText: fb.x,
      feedbackStyle: 'display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-radius:16px;min-height:52px;justify-content:center;' + fb.s
    };
  }
}
</script>
</body>
</html>
