<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lotería de los Pueblos — share image source</title>
<!-- Regenerate all six 1200 × 630 share images with pnpm og:render. -->
<style>
@font-face { font-family: 'Bricolage Grotesque'; font-weight: 600 800; src: url('../../public/fonts/bricolage-grotesque-var-latin.woff2') format('woff2'); }
@font-face { font-family: 'Atkinson Hyperlegible'; font-weight: 400; src: url('../../public/fonts/atkinson-hyperlegible-400-latin.woff2') format('woff2'); }
:root { --ink:#16182F; --paper:#FFF6E5; --maiz:#FFC233; --night:#1E2142; --muted:#4A4766; }
* { box-sizing: border-box; }
html,body { margin:0; width:1200px; height:630px; overflow:hidden; }
body { background:var(--paper) url('../../public/textures/rugged-paper.webp') center/800px; color:var(--ink); font-family:'Atkinson Hyperlegible',sans-serif; }
.frame { position:relative; width:1200px; height:630px; border:12px solid var(--ink); }
.frame::after { content:''; position:absolute; inset:12px; border:2px solid var(--ink); pointer-events:none; }
.brand { position:absolute; width:590px; height:187px; object-fit:contain; top:30px; left:36px; }
.copy { position:absolute; top:242px; left:50px; width:575px; }
.eyebrow { font-family:'Bricolage Grotesque',sans-serif; font-size:20px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; margin:0 0 12px; }
h1 { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:58px; line-height:1.02; letter-spacing:-.035em; margin:0; }
body[data-variant="solo"] h1 { font-size:50px; }
.sub { font-size:25px; line-height:1.3; margin:17px 0 0; max-width:560px; }
.art { position:absolute; inset:0 0 0 630px; }
.card { position:absolute; width:210px; height:315px; border:4px solid var(--ink); border-radius:12px; object-fit:cover; box-shadow:0 7px 0 var(--ink); }
.card.one { left:26px; top:80px; transform:rotate(-12deg); }
.card.two { left:255px; top:104px; transform:rotate(10deg); }
.card.three { left:140px; top:260px; transform:rotate(-2deg); }
.footer { position:absolute; bottom:34px; left:50px; display:flex; align-items:center; gap:14px; font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:22px; }
.footer img { width:34px; height:34px; }
.route { padding-left:14px; border-left:2px solid var(--ink); color:var(--muted); font-weight:600; }
</style>
</head>
<body>
<main class="frame">
  <img class="brand" src="../../public/brand/loteria-banner.webp" alt="Lotería de los Pueblos">
  <section class="copy"><p class="eyebrow" id="eyebrow"></p><h1 id="title"></h1><p class="sub" id="sub"></p></section>
  <div class="art" id="art" aria-hidden="true"></div>
  <div class="footer"><img src="../../public/favicon.svg" alt="">app.loteria.to<span class="route" id="route"></span></div>
</main>
<script>
const variants = {
  default: { eyebrow:'Lotería para compartir', title:'Lotería en línea,<br>gratis y en familia.', sub:'Reúne a tu gente, escucha las cartas y completa tu tabla.', route:'Juega en línea', cards:['jaguar','colibri','maiz'] },
  deck: { eyebrow:'Explora la baraja', title:'Las 144 cartas<br>de lotería.', sub:'Explora las ilustraciones y los nombres en español e inglés.', route:'La baraja', cards:['nopal','luna','jaguar'] },
  solo: { eyebrow:'Una ronda para ti', title:'Juega lotería<br>contra la computadora.', sub:'Practica a tu ritmo con el cantor automático y tu propia tabla.', route:'Jugar a solas', cards:['colibri','sol','frijol'] },
  print: { eyebrow:'Del teléfono al papel', title:'Cartones de lotería<br>para imprimir en PDF.', sub:'Prepara tablas para imprimir y comparte una ronda en persona.', route:'Tablas para imprimir', cards:['maiz','nopal','mariposa'] },
  credits: { eyebrow:'Detrás de cada carta', title:'Créditos, voces<br>y fuentes.', sub:'Consulta los créditos, las licencias y el estado de revisión de las palabras.', route:'Créditos y fuentes', cards:['luna','jaguar','colibri'] },
  invite: { eyebrow:'Hay lugar en la tabla', title:'Te invitaron<br>a una ronda.', sub:'Abre el enlace y entra a la sala desde tu teléfono.', route:'Únete a la sala', cards:['mariposa','maiz','sol'] },
};
const key = new URLSearchParams(location.search).get('variant') || 'default';
const data = variants[key];
document.body.dataset.variant = key;
if (!data) throw new Error(`Unknown OG variant: ${key}`);
for (const field of ['eyebrow','title','sub','route']) document.getElementById(field).innerHTML=data[field];
document.getElementById('art').innerHTML=data.cards.map((id,i)=>`<img class="card ${['one','two','three'][i]}" src="../../public/cards/${id}.webp" alt="">`).join('');
</script>
</body>
</html>
