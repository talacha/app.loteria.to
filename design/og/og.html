<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>OG image source</title>
<!-- Source for public/og/*.png. Render: pnpm og:render (scripts/render-og.mjs). ?variant=default|invite -->
<style>
@font-face { font-family: 'Bricolage Grotesque'; font-weight: 600 800; src: url('../../public/fonts/bricolage-grotesque-var-latin.woff2') format('woff2'); }
@font-face { font-family: 'Bricolage Grotesque'; font-weight: 600 800; src: url('../../public/fonts/bricolage-grotesque-var-latin-ext.woff2') format('woff2'); unicode-range: U+0100-024F; }
@font-face { font-family: 'Atkinson Hyperlegible'; font-weight: 700; src: url('../../public/fonts/atkinson-hyperlegible-700-latin.woff2') format('woff2'); }
@font-face { font-family: 'Atkinson Hyperlegible'; font-weight: 400; src: url('../../public/fonts/atkinson-hyperlegible-400-latin.woff2') format('woff2'); }
:root {
  --night: #1E2142; --raised: #2A2E58; --ink: #16182F; --paper: #FFF6E5; --shadow: #0C0D1E;
  --maiz: #FFC233; --rosa: #D0126B; --jade: #0E9F7E; --cielo: #2A64D6; --maya: #7A4BD6; --quechua: #C2410C;
  --muted: #C9C3E6;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; background: var(--night); color: var(--paper); font-family: 'Atkinson Hyperlegible', sans-serif; }
.frame { position: relative; width: 1200px; height: 630px; padding: 56px 64px; display: grid; grid-template-columns: 1fr 420px; gap: 36px; }
.picado { position: absolute; inset: 0 0 auto 0; height: 34px; display: grid; grid-template-columns: repeat(12, 1fr); }
.picado span { clip-path: polygon(0 0, 100% 0, 100% 62%, 50% 100%, 0 62%); }
.left { display: flex; flex-direction: column; justify-content: center; gap: 18px; padding-top: 10px; padding-bottom: 28px; }
.brand { display: flex; align-items: center; gap: 14px; font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: 26px; letter-spacing: -0.01em; }
.brand img { width: 52px; height: 52px; }
h1 { margin: 0; font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: 64px; line-height: 0.98; letter-spacing: -0.03em; }
h1 em { font-style: normal; color: var(--maiz); }
.sub { margin: 0; font-size: 25px; line-height: 1.3; color: var(--muted); max-width: 600px; }
.langs { display: flex; flex-wrap: nowrap; gap: 8px; }
.lang { font-weight: 700; font-size: 18px; padding: 6px 13px; white-space: nowrap; border-radius: 999px; border: 3px solid var(--ink); color: #fff; }
.cta { display: inline-flex; align-self: flex-start; align-items: center; gap: 12px; font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: 28px; color: var(--ink); background: var(--maiz); border: 3px solid var(--ink); border-radius: 18px; padding: 12px 24px; box-shadow: 0 6px 0 var(--shadow); }
.board { align-self: center; justify-self: center; width: 400px; padding: 14px; background: var(--paper); border: 4px solid var(--ink); border-radius: 26px; box-shadow: 0 10px 0 var(--shadow); transform: rotate(3deg); display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.cell { position: relative; aspect-ratio: 1; background: #fff; border: 3px solid var(--ink); border-radius: 14px; display: flex; align-items: center; justify-content: center; }
.cell img { width: 74%; height: 74%; }
.cell.hit { background: var(--maiz); }
.cell.hit::after { content: ''; position: absolute; right: 6px; top: 6px; width: 26px; height: 18px; border-radius: 50%; background: #6B2F23; border: 2px solid var(--ink); transform: rotate(-18deg); }
.invite .board { transform: rotate(-3deg); }
.code { display: inline-flex; gap: 8px; }
.code span { font-family: 'Bricolage Grotesque'; font-weight: 800; font-size: 44px; width: 58px; text-align: center; color: var(--ink); background: var(--maiz); border: 3px solid var(--ink); border-radius: 12px; padding: 2px 0; }
.foot { position: absolute; left: 64px; bottom: 22px; font-size: 20px; color: var(--muted); }
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="picado" aria-hidden="true">
    <span style="background:var(--maiz)"></span><span style="background:var(--jade)"></span><span style="background:var(--rosa)"></span><span style="background:var(--cielo)"></span><span style="background:var(--paper)"></span><span style="background:var(--maya)"></span>
    <span style="background:var(--quechua)"></span><span style="background:var(--maiz)"></span><span style="background:var(--jade)"></span><span style="background:var(--rosa)"></span><span style="background:var(--cielo)"></span><span style="background:var(--paper)"></span>
  </div>
  <div class="left">
    <div class="brand"><img src="../../public/art/sol.svg" alt="">Lotería de los Pueblos</div>
    <div id="copy"></div>
    <div class="langs">
      <span class="lang" style="background:var(--jade);color:var(--ink)">Náhuatl</span>
      <span class="lang" style="background:var(--maya)">Maya yucateco</span>
      <span class="lang" style="background:var(--quechua)">Quechua</span>
      <span class="lang" style="background:var(--rosa)">Español</span>
      <span class="lang" style="background:var(--cielo)">English</span>
    </div>
  </div>
  <div class="board" id="board"></div>
  <div class="foot" id="foot">app.loteria.to · sin cuentas, sin dinero, solo frijolitos</div>
</div>
<script>
const variant = new URLSearchParams(location.search).get('variant') || 'default';
const ids = ['sol','maiz','colibri','luna','jaguar','nopal','frijol','estrella','mariposa','chile','tortuga','montana','aguacate','rana','nube','tomate'];
const hits = variant === 'invite' ? [0, 5, 10, 15] : [1, 6, 9, 12];
document.getElementById('board').innerHTML = ids.map((id, i) =>
  `<div class="cell${hits.includes(i) ? ' hit' : ''}"><img src="../../public/art/${id}.svg" alt=""></div>`).join('');
const copy = document.getElementById('copy');
if (variant === 'invite') {
  document.getElementById('frame').classList.add('invite');
  copy.innerHTML = `<h1>¡Te invitaron<br>a la <em>Lotería!</em></h1>
    <p class="sub">Toca el enlace o escanea el código y juega desde tu teléfono. Tú eliges en qué idioma escuchas las cartas.</p>
    <span class="cta">Unirme a la sala →</span>`;
} else {
  copy.innerHTML = `<h1>La lotería,<br>cantada en <em>cinco idiomas</em></h1>
    <p class="sub">Escucha cada carta en tu idioma, elige cómo se escribe y llena tu cartón. Toda la familia, desde un código QR.</p>`;
}
</script>
</body>
</html>
