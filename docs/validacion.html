(olla)'; index 'Olla: Manka'."}}}, {"n": 48, "id": "canasta", "category": "handmade", "art": "🧺", "names": {"es": {"text": "la canasta", "status": "approved"}, "en": {"text": "the basket", "status": "approved"}, "nah": {"text": "chiquihuitl", "status": "draft", "source": "https://nahuatl.wired-humanities.org/content/chiquihuitl", "confidence": "sourced", "audio": "/audio/nah/canasta.m4a", "note": "IDIEZ (Sullivan & Olko 2016, Chicontepec, Veracruz) via Online Nahuatl Dictionary; gloss basket"}, "yua": {"text": "xaak", "status": "draft", "source": "https://web.archive.org/web/20201124075518/http://www.mayas.uady.mx/diccionario/c_esp.html", "confidence": "sourced", "audio": "/audio/yua/canasta.m4a", "note": "UADY ES-Maya: CANASTA = xaak, xúuxak; xúux = canasta grande de bejucos (Maya-ES) | Fuente: UADY web dictionary (Bastarrachea et al. 1992), vía Wayback; ortografía moderna, apóstrofo U+2019, entrada en mayúsculas en la fuente"}, "quz": {"text": "isanka", "status": "draft", "source": "http://web.archive.org/web/2011/http://portal.perueduca.edu.pe/Docentes/xtras/pdf/dicc_cusco.pdf", "confidence": "sourced", "audio": "/audio/quz/canasta.m4a", "note": "Minedu entry 'Isanka ... Canasta grande sin asa'. Other runasimi Cusco words: p'uktu, aysana."}}}, {"n": 49, "id": "tambor", "category": "handmade", "art": "🪘", "names": {"es": {"text": "el tambor", "status": "approved"}, "en": {"text": "the drum", "status": "approved"}, "nah": {"text": "huehuetl", "status": "draft", "source": "https://nahuatl.wired-humanities.org/content/huehuetl", "confidence": "weak", "audio": "/audio/nah/tambor.m4a", "variant": "classical", "note": "Molina 1571 (classical), no Huasteca entry found; Molina: atabal (upright indigenous drum); Spanish loan tambor also attested in colonial Nahuatl. No Huasteca drum noun found in IDIEZ"}, "yua": {"text": "tunk'ul", "status": "draft", "source": "https://web.archive.org/web/2020/http://www.mayas.uady.mx/diccionario/t_maya.html", "confidence": "sourced", "audio": "/audio/yua/tambor.m4a", "note": "UADY: 'tambor horizontal hecho de tronco ahuecado' (el tunkul) | Fuente: UADY web dictionary (Bastarrachea et al. 1992), vía Wayback; ortografía moderna, apóstrofo U+2019, entrada en mayúsculas en la fuente"}, "quz": {"text": "tinya", "status": "draft", "source": "http://web.archive.org/web/2011/http://portal.perueduca.edu.pe/Docentes/xtras/pdf/dicc_cusco.pdf", "confidence": "sourced", "audio": "/audio/quz/tambor.m4a", "note": "Minedu index 'Tambor: Tinya'; entry gloss 'Kaha. Tamborín'. Big drum/bombo = wank'ar (Minedu index 'Tambor grande, bombo')."}}}, {"n": 50, "id": "flauta", "category": "handmade", "art": "🪈", "names": {"es": {"text": "la flauta", "status": "approved"}, "en": {"text": "the flute", "status": "approved"}, "nah": {"text": "tlapitzalli", "status": "draft", "source": "https://nahuatl.wired-humanities.org/content/tlapitzalli-0", "confidence": "sourced", "audio": "/audio/nah/flauta.m4a", "note": "IDIEZ (Sullivan & Olko 2016, Chicontepec, Veracruz) via Online Nahuatl Dictionary; IDIEZ gloss: a whistle or wind instrument (not specifically a flute); Molina: flauta, cheremia"}, "yua": {"text": "piitoo", "status": "draft", "source": "https://es.glosbe.com/es/yua/flauta", "confidence": "weak", "audio": "/audio/yua/flauta.m4a", "note": "Préstamo del español (pito). Glosbe, Aulex y es.wiktionary (tabla de traducciones) coinciden en piitoo; Aulex también da chuul. UADY no lista flauta (solo 'siit' = carrizo con el que se hacen flautas). Fuentes débiles."}, "quz": {"text": "pinkullu", "status": "draft", "source": "http://web.archive.org/web/2011/http://portal.perueduca.edu.pe/Docentes/xtras/pdf/dicc_cusco.pdf", "confidence": "sourced", "audio": "/audio/quz/flauta.m4a", "note": "Minedu entry 'Pinkullu ... Flauta, quena' (Minedu index also 'Flauta de pan, zampoña: Antara, siku'). runasimi Qusqu lists qina/qena for quena and pinkuyllu (ocarina)."}}}, {"n": 51, "id": "hilo", "category": "handmade", "art": "🧵", "names": {"es":
