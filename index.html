  </head>
  <body>
    <div id="root"></div>
    <script>
      try {
        var t = localStorage.getItem('loteria:theme') || localStorage.getItem('loteria.theme');
        if (t === 'dark' || t === 'light' || t === 'contrast') {
          document.documentElement.dataset.theme = t;
          var c = t === 'light' ? '#FFC233' : t === 'contrast' ? '#000000' : '#1E2142';
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
            meta.content = c;
          });
        }
        // A prerendered page only paints for its own route (the service worker may serve another).
        var r = document.getElementById('root');
        var p = location.pathname.replace(/\/+$/, '') || '/';
        if (r && r.dataset.route && r.dataset.route !== p) r.innerHTML = '';
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
