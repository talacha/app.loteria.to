  <body>
    <div id="root"></div>
    <script>
      try {
        var t = localStorage.getItem('loteria:theme');
        if (t && t !== 'auto') document.documentElement.dataset.theme = t;
        // A prerendered page only paints for its own route (the service worker may serve another).
        var r = document.getElementById('root');
        var p = location.pathname.replace(/\/+$/, '') || '/';
        if (r && r.dataset.route && r.dataset.route !== p) r.innerHTML = '';
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
